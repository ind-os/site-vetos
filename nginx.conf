# Sert les pages construites par Astro (dist/), sur le port 80.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  server_tokens off;
  # Les pages et les textes sont en UTF-8 : l'en-tête le dit, en plus de la balise meta.
  charset utf-8;
  charset_types text/html text/css text/plain text/xml application/javascript application/json;
  # Derrière le proxy en HTTPS : une redirection garde l'adresse du visiteur.
  absolute_redirect off;

  location / {
    try_files $uri $uri/index.html $uri.html =404;
  }

  # Les fichiers d'Astro portent une empreinte dans leur nom : un contenu changé a un nouveau nom.
  # Le navigateur les garde un an sans redemander.
  location /_astro/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # La sonde rend le commit en ligne : jamais en cache.
  location = /healthz.json {
    add_header Cache-Control "no-store" always;
  }
}
