# Sert les pages construites par Astro (dist/), sur le port 80.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  server_tokens off;
  # Les pages et les textes sont en UTF-8 : l'en-tête le dit, en plus de la balise meta.
  charset utf-8;
  # text/html est toujours compris ; la liste ajoute les autres textes.
  charset_types text/css text/plain text/xml application/javascript application/json;
  # Derrière le proxy en HTTPS : une redirection garde l'adresse du visiteur.
  absolute_redirect off;

  # Les textes partent compressés ; les images et les polices le sont déjà.
  gzip on;
  gzip_vary on;
  gzip_types text/css text/plain text/xml application/javascript application/json application/xml image/svg+xml;

  # Une adresse inconnue rend la page 404 du site, avec le code 404.
  error_page 404 /404.html;

  # Une adresse de page s'écrit avec la barre finale : /payerne redirige vers /payerne/. Un
  # fichier, qui a une extension (/favicon.ico), n'est pas concerné.
  location ~ ^[^.]*[^/]$ {
    return 301 $uri/$is_args$args;
  }

  # Les pages HTML, et les autres fichiers hors de /_astro/ : le navigateur redemande le fichier à
  # chaque visite (no-cache), et nginx ne le renvoie que s'il a changé. Les horaires affichés ne
  # restent pas périmés.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/index.html =404;
  }

  # Les fichiers d'Astro portent une empreinte dans leur nom : un contenu changé a un nouveau nom.
  # Le navigateur les garde un an sans redemander.
  location /_astro/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # La sonde rend le commit en ligne : jamais en cache.
  location = /healthz.json {
    add_header Cache-Control "no-store" always;
  }
}
